name: Deploy Production

on:
  push:
    branches:
      - production

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable yarn

      - name: Enable yarn cache
        uses: actions/setup-node@v7
        with:
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn

      - name: Build
        run: |
          yarn build
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  create-release:
    needs: deploy
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes

  synchronise-changelogs:
    needs: create-release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v7
        with:
          path: source
          ref: main

      - name: Checkout Production Branch
        uses: actions/checkout@v7
        with:
          path: production
          ref: production

      - name: Synchronise changelogs
        run: |
          rsync -av --delete production/changelogs/ source/changelogs/
          cp production/docs/reference/change-log.md source/docs/reference/change-log.md

      - name: Commit and push changes
        run: |
          cd source

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Synchronising changelogs from production branch."
          git status
          echo "Porcelain output:"
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "cd: synchronise changelogs from production."
            git push origin main
          fi
