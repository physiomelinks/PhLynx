name: Vitest Tests

on:
  # Other branches are tested through their pull request, which avoids running the tests twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch (or PR) cancels the run still in progress; only the latest commit is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-testing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable && yarn install --frozen-lockfile

      - run: yarn test
