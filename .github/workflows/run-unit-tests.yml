name: Vitest Tests

on:
  push:
  pull_request:

jobs:
  unit-testing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable && yarn install --frozen-lockfile

      - run: yarn test


      # run_protocol.py, which protocol exports ship: it compiles, and its tables and plots work without libcuflynx.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: python -m pip install numpy pandas matplotlib seaborn && python -m unittest discover -s tests/python -v
