name: Deploy Staging
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: staging, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable yarn

      - name: Enable yarn cache
        uses: actions/setup-node@v7
        with:
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn

      - name: Build
        run: |
          yarn build

      - name: Prepare
        run: |
          cp dist/index.html dist/404.html
          echo "staging.phlynx.com" > dist/CNAME
          touch dist/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.STAGING_DEPLOY_KEY }}
          external_repository: physiomelinks/staging-phlynx-website
          publish_branch: main
          publish_dir: ./dist
          force_orphan: true
