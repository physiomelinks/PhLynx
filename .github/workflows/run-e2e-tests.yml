name: Playwright Tests

on:
  # Other branches are tested through their pull request, which avoids running the tests twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch (or PR) cancels the run still in progress; only the latest commit is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-testing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: corepack enable && yarn install --frozen-lockfile

      - run: pip install -r tests/requirements.txt

      # WebKit too, for the CellDL tests that also run in Safari's engine (test_celldl.py fails, not skips, a
      # missing WebKit under CI); the rest of the suite runs in Chromium.
      - run: playwright install --with-deps chromium webkit

      - run: yarn dev &
      
      # Wait for app to be ready
      - run: npx wait-on http://localhost:5173

      - run: python tests/run_playwright_tests.py
