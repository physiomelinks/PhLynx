<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Cross-origin isolation, which the simulator's SharedArrayBuffer needs, from public/coi-serviceworker.js.
         It runs before anything else loads; the first visit reloads once to install it. Chrome and Firefox use
         COEP credentialless, which loads cross-origin scripts without credentials; other browsers require CORP. -->
    <script>
      function isolatesUnderAutomation() {
        try {
          return localStorage.getItem('phlynx.isolateUnderAutomation') === 'true'
        } catch {
          return false
        }
      }
      window.coi = {
        // Automated browsers (Playwright) skip it unless a test opts in, since page.route can't see requests
        // that go through a service worker.
        shouldRegister: () => !navigator.userAgent.includes('Electron') && (!navigator.webdriver || isolatesUnderAutomation()),
        coepCredentialless: () => !!(window.chrome || window.netscape),
      }
    </script>
    <script src="/coi-serviceworker.js"></script>
    <script>
      ;(function (w, d, s, l, i) {
        w[l] = w[l] || []
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : ''
        j.async = true
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl
        f.parentNode.insertBefore(j, f)
      })(window, document, 'script', 'dataLayer', 'GTM-P4W97ZNG')
    </script>
    <link rel="icon" type="image/svg+xml" href="/phlynxlogo.svg" />
    <link rel="icon" sizes="32x32" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhLynx</title>
  </head>
  <body>
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-P4W97ZNG"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      >
      </iframe>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
